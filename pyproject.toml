# Dependencies live in requirements.txt / requirements-dev.txt (pinned).
[project]
name = "ngs-barcoding-planner"
version = "0.3.0"
description = "Plan and record Tag&Pool well barcodes, pools, sample indexes and NGS runs — with audit trail and 4-eyes sign-off."
requires-python = ">=3.11"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]
