{% extends "planner/base.html" %}
{% block content %}
<h1>{{ title }}</h1>
{% if note %}<p class="sub">{{ note }}</p>{% endif %}
<div class="card" style="max-width:760px">
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for f in form %}
  <div class="field">{{ f.label_tag }} {{ f }}
    {% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}{{ f.errors }}</div>
  {% endfor %}
  <button>Save</button> <a class="btn secondary" href="javascript:history.back()">Cancel</a>
</form>
</div>
{% endblock %}
